# secret-scan.yml — CONTROLE MECANICO no servidor: varredura de segredo (Constitution §10; docs2/THREAT-MODEL.md; hooks/README.md "O que contorna o pre-commit").
# TEMPLATE (GitHub Actions). NAO foi executado em um repositorio real: so a sintaxe (parser YAML) e a logica do comando (simulacao local) foram testadas.
# Como usar: copie para <projeto-alvo>/.github/workflows/secret-scan.yml (docs2 em <raiz>/docs2/). Torne o job `secret-scan` um check OBRIGATORIO na protecao de ramo:
#   e o unico ponto que quem cria o commit nao desliga com `--no-verify`.
# Job 1 (`secret-scan`): a logica do proprio docs2 (`secret-scan.mjs --all`) sobre todos os arquivos rastreados. Heuristica (ver hooks/README.md: limites); nao le historico.
# Job 2 (`gitleaks`, OPCIONAL, desligado por padrao): gitleaks sobre o HISTORICO. Ligue criando a variavel de repositorio USE_GITLEAKS=true. Para repositorios de
#   ORGANIZACAO a gitleaks-action exige a licenca (secret GITLEAKS_LICENSE); confira os termos atuais antes de ligar. Alternativa sem a action: baixar o binario gitleaks.
#   O job gitleaks roda em `pull_request` com `permissions: contents: read`: a action pode precisar de `pull-requests: read` (NAO verificado; teste-o ao ligar o job).
# Acoes fixadas por SHA de commit (comentario = versao). Verifique/atualize os SHAs periodicamente.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - name: Varrer segredo em todos os arquivos rastreados (nunca imprime o valor)
        run: node .github/scripts/secret-scan.mjs --all

  gitleaks:
    if: ${{ vars.USE_GITLEAKS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio com o historico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (historico)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
